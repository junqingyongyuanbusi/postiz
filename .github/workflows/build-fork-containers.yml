---
name: Build Fork Containers
run-name: Build fork image ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Image version
        required: true
        default: v1.0.0
        type: string

permissions:
  contents: read

concurrency:
  group: fork-image-${{ inputs.version }}
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}

jobs:
  build-containers:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runnertags: ubuntu-latest
            arch: amd64
          - runnertags: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runnertags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate version and build context
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9_.-]+)?$ && ${#VERSION} -le 120 ]] || exit 1
          while IFS= read -r path; do
            case "$path" in
              .env.example|*/.env.example) ;;
              .env|.env.*|*/.env|*/.env.*)
                printf '::error::Build context contains an environment file: %s\n' "$path"
                exit 1
                ;;
            esac
          done < <(git ls-files)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and Push Image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker buildx build --platform "linux/$ARCH" \
            -f Dockerfile.dev \
            -t "$image:$VERSION-$ARCH" \
            --build-arg "NEXT_PUBLIC_VERSION=$VERSION" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.postiz.source.branch=$GITHUB_REF_NAME" \
            --label "org.postiz.source.commit=$GITHUB_SHA" \
            --label "org.postiz.source.dirty=false" \
            --label "org.postiz.source.diffsha1=$(git diff --binary HEAD | sha1sum | cut -d ' ' -f1)" \
            --label "org.postiz.build.time=$build_time" \
            --pull --provenance=false --sbom=false --push .

  build-container-manifest:
    needs: build-containers
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create and verify Docker manifest
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create \
            --tag "$image:$VERSION" \
            --tag "$image:latest" \
            "$image:$VERSION-amd64" \
            "$image:$VERSION-arm64"
          docker buildx imagetools inspect "$image:$VERSION"
          printf 'Image: `%s:%s`\n' "$image" "$VERSION" >> "$GITHUB_STEP_SUMMARY"
